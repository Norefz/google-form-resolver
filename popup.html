<!doctype html>
<html>
  <head>
    <style>
      body {
        width: 280px;
        padding: 20px;
        font-family: "Segoe UI", Roboto, sans-serif;
        text-align: center;
        background-color: #ffffff;
        margin: 0;
      }
      .profile-card {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        border: 1px solid #e0e0e0;
      }
      .avatar {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: linear-gradient(135deg, #1a73e8, #8ab4f8);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: bold;
        margin: 0 auto 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
      }
      .user-name {
        font-size: 18px;
        font-weight: 600;
        color: #202124;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .user-role {
        font-size: 10px;
        color: #1a73e8;
        margin-top: 4px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: bold;
      }

      /* --- NEW: CSS UNTUK STATS & QUOTA --- */
      .stats-panel {
        background: #ffffff;
        border: 1px solid #e0e0e0;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 15px;
      }
      .stats-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .stat-item {
        text-align: left;
      }
      .stat-label {
        display: block;
        font-size: 10px;
        color: #5f6368;
        text-transform: uppercase;
        font-weight: bold;
      }
      .stat-value {
        font-size: 16px;
        font-weight: bold;
        color: #202124;
      }
      .progress-container {
        width: 100%;
        background-color: #e8eaed;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
      }
      .progress-bar {
        width: 0%; /* Diupdate lewat popup.js */
        height: 100%;
        background-color: #1a73e8;
        transition: width 0.3s ease;
      }

      .solve-btn {
        width: 100%;
        padding: 12px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: all 0.2s;
      }
      .solve-btn:hover:not(:disabled) {
        background-color: #1765cc;
        transform: translateY(-1px);
      }
      .solve-btn:disabled {
        background-color: #bdc1c6;
        cursor: not-allowed;
      }
      .footer-text {
        font-size: 9px;
        color: #9aa0a6;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <div class="profile-card">
      <div class="avatar" id="avatarLetter">?</div>
      <h3 class="user-name" id="userName">Syncing...</h3>
      <div class="user-role">Premium Student</div>
    </div>

    <div class="stats-panel">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">Solved</span>
          <span class="stat-value" id="solvedCount">0</span>
        </div>
        <div class="stat-item" style="text-align: right">
          <span class="stat-label">Remaining</span>
          <span class="stat-value" id="quotaLeft">50</span>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-bar" id="quotaProgress"></div>
      </div>
    </div>

    <button id="solveAllBtn" class="solve-btn">
      <span>Solve All Problems</span> ✨
    </button>

    <div class="footer-text">Gemma Engine • Daily Quota Managed</div>

    <script src="popup.js"></script>
  </body>
</html>
